name: Build Windows Package

# Manual builds only: Actions tab -> Build Windows Package -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "安装包版本号（例如 0.2.0）"
        required: true
        default: "0.2.0"
      bundle_napcat:
        description: "打包 QQ 桥接 NapCat（约 345MB）"
        type: boolean
        default: true
      with_browser:
        description: "打包网站登录用的 Chromium（约 150MB）"
        type: boolean
        default: false
      publish_release:
        description: "构建成功后发布 GitHub Release（标签 v<版本号>）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUNDLE_NAPCAT: ${{ inputs.bundle_napcat }}
      WITH_BROWSER: ${{ inputs.with_browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Validate version
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^\d+\.\d+\.\d+$') {
            throw "版本号必须形如 0.2.0"
          }

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found after install" }

      - name: Prepare NapCat
        if: ${{ inputs.bundle_napcat }}
        run: python scripts/napcat.py install

      - name: Build portable package
        shell: pwsh
        run: |
          $args = @()
          if ($env:BUNDLE_NAPCAT -ne "true") { $args += "-SkipNapCat" }
          if ($env:WITH_BROWSER -eq "true") { $args += "-WithBrowser" }
          ./scripts/build_package.ps1 -Python python @args

      - name: Smoke test packaged app
        shell: pwsh
        run: ./scripts/smoke_package.ps1

      - name: Verify no personal data in package
        shell: pwsh
        run: |
          foreach ($relative in @("config.json", "data", "digests")) {
            if (Test-Path (Join-Path "dist\MsgDesk" $relative)) {
              throw "构建产物包含个人数据: $relative"
            }
          }
          if (-not (Test-Path "dist\MsgDesk\_internal\webview")) {
            throw "打包结果缺少 pywebview（桌面窗口依赖）"
          }

      - name: Build installer
        shell: pwsh
        run: ./scripts/build_installer.ps1 -Version "${{ inputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MsgDesk-${{ inputs.version }}
          path: |
            dist/MsgDesk-Setup-${{ inputs.version }}.exe
            dist/MsgDesk-win64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          $tag = "v$version"
          $notes = @(
            "MsgDesk $version — 个人消息工作台",
            "",
            "## 功能",
            "- QQ 群消息采集（NapCat）：文本、文件、图片，原图失效时回退本机缓存",
            "- 校内网通知采集：正文图片本地化，附件链接可点击",
            "- 消息页：按日期分组，来源筛选、搜索、已读 / 忽略 / 分类",
            "- 每日日报：可配置生成时间，含群聊摘要与待办",
            "- 基础配置：全局时间范围、开机自启",
            "",
            "## 安装",
            "下载 MsgDesk-Setup-$version.exe 双击安装，无需管理员权限。",
            "",
            "## 说明",
            "- 内置 NapCat，首次使用需扫码登录 QQ",
            "- 校内网附件走下载页验证码，需在浏览器里手动输入"
          ) -join "`n"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag 已存在" }
          gh release create $tag `
            "dist\MsgDesk-Setup-$version.exe" `
            "dist\MsgDesk-win64.zip" `
            --title "MsgDesk $version" `
            --notes $notes
